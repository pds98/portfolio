# Intégration continue (bonus) : lint, typage, tests et build à chaque push / PR
name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: portfolio, POSTGRES_USER: portfolio, POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U portfolio" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://portfolio:ci@localhost:5432/portfolio
      REDIS_URL: redis://localhost:6379
      BCRYPT_ROUNDS: "4"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: PGPASSWORD=ci psql -h localhost -U portfolio -d portfolio -f db/init.sql -f db/seed.sql
      - run: npm run lint && npm run format:check && npm run typecheck
      - run: npm run test:integration
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm run format:check
      - run: npm test
      - run: npm run build
