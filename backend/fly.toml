# API Express sur Fly.io (image « prod » du Dockerfile, Chromium inclus pour les PDF).
# Secrets (fly secrets set) : DATABASE_URL (fly postgres attach), REDIS_URL, CORS_ORIGIN.
# Le site Vercel relaie /api vers cette app : le navigateur ne voit qu'une seule origine.
# Déploiement :  cd backend && fly deploy
app = "portfolio-demba-api"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"
  build-target = "prod"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Machine arrêtée quand personne ne visite (coût réduit), relancée à la première requête
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  # Chromium (génération des CV) a besoin d'au moins 512 Mo
  memory = "1gb"
